# Netlify configuration — BHARATSOLVE SEO AGENCY (Web PWA Dashboard)
#
# base = "web" so Netlify does NOT detect the Python `requirements.txt` at the
# repo root (which triggers a failing "pip install" during git-integration builds).
# Functions live at web/netlify/functions/ so they still deploy with base="web".

[build]
  base = "web"
  publish = "."
  command = "echo 'Static web dashboard ready for deployment'"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# SPA fallback for the PWA (functions at /.netlify/functions/* are served first).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
